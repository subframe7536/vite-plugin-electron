name: probe-win-shutdown

on:
  push:
    branches:
      - debug/win-shutdown-probe

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: playground/shutdown
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install
        working-directory: .
      - run: node scripts/probe-win.mjs quit direct
      - run: node scripts/probe-win.mjs exit direct
      - run: node scripts/probe-win.mjs quit pnpm
      - run: node scripts/probe-win.mjs exit pnpm
      - run: node scripts/probe-win.mjs quit console
      - run: node scripts/probe-win.mjs exit console
      - name: install wmic
        continue-on-error: true
        shell: pwsh
        run: |
          DISM /Online /Add-Capability /CapabilityName:WMIC~~~~ /NoRestart
          wmic process get ProcessId,ParentProcessId /FORMAT:CSV | Select-Object -First 4
      - run: node scripts/probe-win.mjs quit console
      - run: node scripts/probe-win.mjs exit console
